[package]
name = "phew"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Fast HTML + PHP formatter for Yii 2 view files"
license = "MIT"
repository = "https://github.com/WarLikeLaux/phew"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
rayon = "1.10"
similar = "2.6"
ignore = "0.4"

[dev-dependencies]
pretty_assertions = "1"
proptest = "1"
